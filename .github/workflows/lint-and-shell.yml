name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-shell:
    name: Lint and shell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff==0.16.8
      - name: Lint Python
        # Keep the existing Wan import exception local to this file and rule.
        run: >-
          python -m ruff check --select E9,F
          --extend-per-file-ignores src/video/wan_geometry.py:F401
          src config scripts opd tests
      - name: Check Bash syntax
        shell: bash
        run: |
          git ls-files -z -- '*.sh' '*.slurm' | while IFS= read -r -d '' script; do
            bash -n -- "$script" || exit 1
          done
